# Render Blueprint —— 一键部署配置
# 作用：把本项目托管到 Render 免费层，无需手动填构建/启动命令。
# 部署方式：在 Render 新建 Web Service 并连接本仓库后，Render 会自动读取此文件。
services:
  - type: web
    name: lixue-dynamic
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
