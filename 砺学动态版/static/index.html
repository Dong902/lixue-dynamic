<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>砺学 · 学业成长 AI 赋能体系 原型</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"></div>
<script src="js/data.js"></script>
<script src="js/crypto.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    LX.ui.init().catch(function (e) {
      document.getElementById('app').innerHTML =
        '<div style="padding:40px;font-family:Microsoft YaHei">' +
        '<h3>初始化失败</h3><p>' + String(e && e.message ? e.message : e) + '</p>' +
        '<p style="color:#6B7A90">若使用 file:// 打开遇到问题，请改用 Chrome / Edge 浏览器。</p></div>';
      console.error(e);
    });
  });
</script>
